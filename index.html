<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catploit</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050505;
            color: #fff;
            font-family: "Trebuchet MS", Arial, sans-serif;
            min-height: 100vh;
        }

        nav {
            height: 58px;
            border-bottom: 1px solid #1c1c1c;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 5px;
        }

        .nav-links {
            display: flex;
            gap: 34px;
        }

        .nav-links a {
            color: #888;
            text-decoration: none;
            font-size: 13px;
            transition: 0.2s;
        }

        .nav-links a:hover {
            color: white;
        }

        .nav-links a.active {
            color: white;
        }

        main {
            min-height: calc(100vh - 58px);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        main::before {
            content: "";
            position: absolute;
            width: 700px;
            height: 500px;
            background: radial-gradient(
                circle,
                rgba(255,255,255,0.045),
                transparent 65%
            );
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }

        .hero {
            position: relative;
            z-index: 1;
            margin-top: -50px;
        }

        h1 {
            font-size: clamp(60px, 9vw, 110px);
            font-weight: 800;
            letter-spacing: -5px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #999;
            font-size: 25px;
            margin-bottom: 25px;
        }

        .description {
            color: #666;
            font-size: 16px;
            margin-bottom: 42px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .button {
            text-decoration: none;
            color: white;
            border: 1px solid #242424;
            border-radius: 30px;
            padding: 15px 32px;
            font-size: 14px;
            font-weight: 600;
            transition: 0.25s;
        }

        .button:hover {
            border-color: #555;
            background: #111;
            transform: translateY(-2px);
        }

        .button.primary {
            background: white;
            color: #080808;
            border-color: white;
        }

        .button.primary:hover {
            background: #ddd;
            border-color: #ddd;
        }

        @media (max-width: 700px) {
            nav {
                padding: 0 25px;
            }

            .nav-links {
                display: none;
            }

            h1 {
                font-size: 65px;
            }

            .subtitle {
                font-size: 20px;
            }

            .description {
                padding: 0 25px;
            }
        }
    </style>
</head>

<body>

    <nav>

        <div class="logo">
            CATPLOIT
        </div>

        <div class="nav-links">

            <a href="#" class="active">
                Home
            </a>

            <!-- Roblox -->
            <a
                href="https://www.roblox.com/de/users/11262324818/profile"
                target="_blank"
                rel="noopener noreferrer"
            >
                Roblox
            </a>

            <a href="#documentation">
                Documentation
            </a>

            <!-- Discord -->
            <a
                href="https://discord.gg/3wepXYz4c"
                target="_blank"
                rel="noopener noreferrer"
            >
                Discord
            </a>

        </div>

    </nav>


    <main>

        <section class="hero">

            <h1>
                Catploit
            </h1>

            <div class="subtitle">
                Making Minecraft better
            </div>

            <div class="description">
                A modern Minecraft client made for players.
            </div>

            <div class="buttons">

                <!-- Direkter Download -->
                <a
                    class="button primary"
                    href="Catploit.exe"
                    download="Catploit.exe"
                >
                    Download
                </a>

                <a
                    class="button"
                    href="#documentation"
                >
                    Documentation
                </a>

                <a
                    class="button"
                    href="https://discord.gg/3wepXYz4c"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Discord
                </a>

            </div>

        </section>

    </main>

</body>
</html>
